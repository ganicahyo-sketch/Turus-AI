plugins {
    id 'com.android.application'
}

android {
    namespace 'id.ganicahyo.automaticirrigation'
    compileSdk 35

    defaultConfig {
        applicationId 'id.ganicahyo.automaticirrigation'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
