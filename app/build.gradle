plugins { id 'com.android.application' }

android {
    namespace 'id.turus.stasiuncuaca'
    compileSdk 36

    defaultConfig {
        applicationId 'id.turus.stasiuncuaca'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
